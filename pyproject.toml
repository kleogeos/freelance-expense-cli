[project]
name = "freelance-expense-cli"
version = "1.0.0"
description = "Track business expenses for tax reporting. Zero dependencies, local JSON file, no cloud account."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}

[project.scripts]
freelance-expense = "expense:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["expense"]
