[project]
name = "freelance-expense-cli"
version = "1.0.0"
description = "Track business expenses for tax reporting. Zero dependencies, local JSON file, no cloud account."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "kleogeos", email = "kleogeos@gmail.com"}]
keywords = ["freelance", "expense-tracker", "bookkeeping", "tax", "cli"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Other Audience",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial",
]

[project.urls]
Homepage = "https://github.com/kleogeos/freelance-expense-cli"
Repository = "https://github.com/kleogeos/freelance-expense-cli"

[project.scripts]
freelance-expense = "expense:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["expense"]
